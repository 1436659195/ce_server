<!doctype html>
<!--
  雇佣网关访客页(单文件,relay /hire/* 伺服;2026-11-19)。
  - code 从 URL path(/hire/<code>)、房钥从 URL fragment(#k=…)—— fragment 不随 HTTP 上行,relay 不见钥。
  - 密文格式与手机/ce 同一套:seal = 24B nonce || secretbox(XSalsa20-Poly1305, tweetnacl)。
  - WS 通路:首帧 {type:'guest-hello', code}(明文,不进 URL);入房后全部走 GroupFrame wire
    ({type:9, payload: b64(信封 JSON)}),op 白名单 sync/post/ack/revoke。
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雇佣对话</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 15px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #1c1e21; }
  @media (prefers-color-scheme: dark) { body { background: #101214; color: #e6e8ea; } }
  #app { max-width: 640px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid rgba(128,128,128,.25); display: flex; align-items: baseline; gap: 8px; }
  header small { font-weight: 400; opacity: .6; }
  #log { flex: 1; overflow-y: auto; padding: 12px 12px 4px; }
  .row { display: flex; margin: 6px 0; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); word-break: break-word; }
  @media (prefers-color-scheme: dark) { .bubble { background: #1d2126; } }
  .row.me .bubble { background: #d9f0ff; }
  @media (prefers-color-scheme: dark) { .row.me .bubble { background: #1f3a4d; } }
  .who { font-size: 12px; opacity: .55; margin: 0 8px 2px; }
  .tomb { opacity: .55; font-style: italic; }
  .sys { text-align: center; font-size: 12px; opacity: .55; margin: 8px 0; }
  .bubble table { border-collapse: collapse; margin: 4px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid rgba(128,128,128,.4); padding: 3px 8px; }
  .bubble code { background: rgba(128,128,128,.18); padding: 1px 4px; border-radius: 4px; }
  #banner { display: none; text-align: center; padding: 8px; background: rgba(255,180,0,.15); font-size: 13px; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(128,128,128,.25); }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit; font: inherit; }
  button { padding: 10px 16px; border-radius: 10px; border: 0; background: #2b7de9; color: #fff; font: inherit; }
  button:disabled { opacity: .4; }
  #setup { margin: auto; padding: 24px; max-width: 420px; width: 100%; }
  #setup textarea { width: 100%; height: 72px; margin: 12px 0; padding: 10px; border-radius: 8px; border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit; font: inherit; }
  #setup .err { color: #d33; font-size: 13px; min-height: 18px; }
  #setup p { font-size: 13px; opacity: .7; }
  #toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; }
</style>
</head>
<body>
<div id="app">
  <header><span id="gname">雇佣对话</span><small id="state"></small></header>
  <div id="banner">雇佣已结束(主人已关闭)</div>
  <div id="log"></div>
  <form id="box" hidden><input type="text" id="msg" maxlength="10000" placeholder="输入消息…" autocomplete="off"><button>发送</button></form>
  <div id="setup">
    <h3>雇佣对话</h3>
    <p>请粘贴主人发给你的<b>完整链接</b>(链接里带着这间会客室的钥匙,缺了打不开)。</p>
    <textarea id="link" placeholder="https://…/hire/XXXX-XXXX#k=…"></textarea>
    <div class="err" id="setupErr"></div>
    <button id="go">进入</button>
  </div>
  <div id="toast"></div>
</div>
<script>__NACL_JS__</script>
<script>
'use strict'
// ─── 工具 ────────────────────────────────────────────────────────────────────
const enc = new TextEncoder(), dec = new TextDecoder()
const b64e = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s) }
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const $ = (id) => document.getElementById(id)
function toast(t, ms = 2600) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => (el.style.display = 'none'), ms) }

// ─── 密文原语(与 ce src/shared/crypto.ts 同形)─────────────────────────────────
const seal = (key, pt) => { const n = nacl.secretbox.nonceLength, nonce = nacl.randomBytes(n), ct = nacl.secretbox(pt, nonce, key), out = new Uint8Array(n + ct.length); out.set(nonce); out.set(ct, n); return out }
const open_ = (key, sealed) => { const n = nacl.secretbox.nonceLength, pt = nacl.secretbox.open(sealed.subarray(n), sealed.subarray(0, n), key); if (!pt) throw new Error('bad seal'); return pt }
const sealText = (key, text) => b64e(seal(key, enc.encode(JSON.stringify({ kind: 'text', text }))))
const openText = (key, ct) => { const p = JSON.parse(dec.decode(open_(key, b64d(ct)))); return p }

// ─── 状态 ────────────────────────────────────────────────────────────────────
const S = { code: '', key: null, ws: null, groupId: '', memberId: '', groupName: '', msgs: new Map(), readUpTo: 0, pending: new Map(), ended: false, resending: false }

function frame(env) { return JSON.stringify({ type: 9, payload: b64e(enc.encode(JSON.stringify(env))) }) }
function send(env) { if (S.ws && S.ws.readyState === 1) S.ws.send(frame(env)) }
function rpc(env) { env.reqId = 'gq_' + Math.random().toString(36).slice(2, 10); S.pending.set(env.reqId, env); send(env) }

// ─── 渲染 ────────────────────────────────────────────────────────────────────
function mdTable(rows) { return '<table><thead><tr>' + rows[0].map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.slice(2).map((r) => '<tr>' + r.map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>' }
function inlineMd(s) { return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>') }
function md(src) {
  const lines = esc(src).split('\n'); let html = ''
  for (let i = 0; i < lines.length; i++) {
    const isSep = (l) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l)
    if (lines[i].includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      const rows = []
      while (i < lines.length && lines[i].includes('|')) {
        rows.push(lines[i].replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => inlineMd(c.trim()))); i++
      }
      html += mdTable(rows); continue
    }
    html += inlineMd(lines[i]) + '<br>'
  }
  return html
}
function nearBottom() { const l = $('log'); return l.scrollHeight - l.scrollTop - l.clientHeight < 80 }
function render() {
  const stick = nearBottom(), log = $('log'), me = S.memberId
  const seqs = [...S.msgs.keys()].sort((a, b) => a - b)
  log.innerHTML = seqs.map((q) => {
    const m = S.msgs.get(q) // Map 必须 .get(下标取值恒 undefined → render 炸被 onmessage 吞,页面全空白)
    if (m.sys) return `<div class="sys">${esc(m.text)}</div>`
    if (m.revoked) return `<div class="row${m.fromId === me ? ' me' : ''}"><div class="bubble tomb">消息已撤回</div></div>`
    const who = m.fromId === me ? '' : `<div class="who">${esc(m.fromName)}</div>`
    const tip = m.fromId === me ? ' title="点击撤回"' : ''
    return `<div class="row${m.fromId === me ? ' me' : ''}">${who}<div class="bubble"${tip} data-seq="${q}">${md(m.text)}</div></div>`
  }).join('')
  if (stick) log.scrollTop = log.scrollHeight
}
$('log').addEventListener('click', (e) => {
  const b = e.target.closest('.bubble')
  if (!b || !b.dataset.seq) return
  const q = Number(b.dataset.seq)
  if (!confirm('撤回这条消息?')) return
  rpc({ op: 'group-revoke', groupId: S.groupId, payload: { seq: q, memberId: S.memberId } })
})

// ─── 协议入向 ────────────────────────────────────────────────────────────────
function mergeEnv(env) {
  if (env.op === 'group-result') {
    const r = env.payload || {}, p = S.pending.get(r.reqId || env.reqId)
    if (!p) return
    S.pending.delete(r.reqId || env.reqId)
    if (p._for === 'sync') {
      if (!r.ok) return toast('读取失败:' + (r.error || {}).code)
      let last = S.readUpTo
      for (const m of r.data.msgs || []) { absorb(m); last = Math.max(last, m.seq) }
      S.readUpTo = last
      render()
      ack()
    }
    if (p._for === 'post') {
      if (r.ok) { S.readUpTo = Math.max(S.readUpTo, r.data.seq || 0); return }
      if ((r.error || {}).code === 'new_messages') {
        for (const m of (r.data || {}).msgs || []) absorb(m)
        render(); ack()
        if (!S.resending) { S.resending = true; setTimeout(() => { S.resending = false; doSend(p._text) }, 150) }
      } else toast((r.error || {}).message || '发送失败')
    }
    return
  }
  if (env.op === 'group-msg') {
    absorb(env.payload)
    render(); ack()
    return
  }
  if (env.op === 'group-meta') {
    const ev = env.payload || {}
    if (ev.event === 'dissolved') { S.ended = true; $('banner').style.display = 'block'; $('box').hidden = true }
    if (ev.event === 'member-joined' && ev.member) toast(ev.member.name + ' 进入了会客室')
    return
  }
}
function absorb(m) {
  if (!m || typeof m.seq !== 'number') return
  if (m.revokedAt) { S.msgs.set(m.seq, { seq: m.seq, revoked: true, fromId: m.from.memberId }); return }
  try {
    const pt = openText(S.key, m.ct)
    if (pt.kind === 'system') S.msgs.set(m.seq, { seq: m.seq, sys: true, text: pt.text })
    else if (pt.kind === 'text') S.msgs.set(m.seq, { seq: m.seq, text: pt.text, fromName: m.from.name, fromId: m.from.memberId })
  } catch { /* 解不开(钥不对/非本房间):跳过 */ }
}
function ack() { if (S.readUpTo > 0) send({ op: 'group-ack', groupId: S.groupId, payload: { groupId: S.groupId, memberId: S.memberId, upToSeq: S.readUpTo } }) }
function doSend(text) {
  rpc({ _for: 'post', _text: text, op: 'group-post', groupId: S.groupId, payload: { ct: sealText(S.key, text), opKey: 'gu_' + b64e(nacl.randomBytes(6)), readUpTo: S.readUpTo, memberId: S.memberId } })
}
$('box').addEventListener('submit', (e) => {
  e.preventDefault()
  const t = $('msg').value.trim()
  if (!t || S.ended) return
  $('msg').value = ''
  doSend(t)
})

// ─── 连接 ────────────────────────────────────────────────────────────────────
function start() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/guest')
  S.ws = ws
  $('state').textContent = '连接中…'
  ws.onopen = () => ws.send(JSON.stringify({ type: 'guest-hello', code: S.code }))
  ws.onmessage = (e) => {
    let d
    try { d = JSON.parse(e.data) } catch { return }
    if (d.type === 'guest-joined') {
      S.groupId = d.groupId; S.memberId = d.memberId; S.groupName = d.groupName || '雇佣对话'
      $('gname').textContent = S.groupName
      $('state').textContent = '已连接'
      $('setup').style.display = 'none'; $('box').hidden = false
      rpc({ _for: 'sync', op: 'group-sync', groupId: S.groupId, payload: { groupId: S.groupId, memberId: S.memberId, afterSeq: 0, limit: 200 } })
      return
    }
    if (d.type === 'error') { backToSetup(d.reason || '连接被拒'); return }
    // 群帧:{type:9,payload:b64}
    try { mergeEnv(JSON.parse(dec.decode(b64d(d.payload)))) } catch { /* 脏帧忽略 */ }
  }
  ws.onclose = () => {
    if (S.ended) return
    $('state').textContent = '已断开'
    if (S.groupId) { toast('连接断开,3 秒后重连…'); setTimeout(start, 3000) } else backToSetup('连接已断开')
  }
}
function backToSetup(reason) {
  $('setupErr').textContent = reason || ''
  $('setup').style.display = 'block'; $('box').hidden = true
  if (S.ws) { try { S.ws.onclose = null; S.ws.close() } catch {} }
  S.groupId = ''; S.ws = null
}
$('go').addEventListener('click', () => {
  const raw = $('link').value.trim()
  const err = $('setupErr')
  err.textContent = ''
  try {
    const u = new URL(raw)
    const m = u.pathname.match(/\/hire\/([A-Z2-7]{4,9}-[A-Z2-7]{4,9})/i)
    const k = (u.hash || '').match(/^#k=([A-Za-z0-9+/=]+)$/)
    if (!m || !k) throw new Error('链接不完整')
    S.code = m[1].toUpperCase()
    S.key = b64d(k[1])
    if (S.key.length !== 32) throw new Error('钥匙格式不对')
    $('setup').style.display = 'none'
    start()
  } catch (e2) { err.textContent = '链接不完整:请原样粘贴主人发的完整链接(' + e2.message + ')' }
});
// ↑ 分号必须:无分号 + 下一行 ( 开头 = ASI 把 init 解析成对上一条返回值的调用(首载即炸)

// ─── 入口:URL 自带 code+key 则直接进,否则出setup ────────────────────────────────
(function init() {
  const m = location.pathname.match(/\/hire\/([A-Z2-7]{4,9}-[A-Z2-7]{4,9})/i)
  const k = (location.hash || '').match(/^#k=([A-Za-z0-9+/=]+)$/)
  if (m && k) {
    S.code = m[1].toUpperCase()
    try { S.key = b64d(k[1]) } catch { S.key = null }
    if (S.key && S.key.length === 32) { $('setup').style.display = 'none'; start(); return }
  }
  /* 留在 setup 面板 */
})()
</script>
</body>
</html>

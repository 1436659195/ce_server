const enc=new TextEncoder(),dec=new TextDecoder(),$=id=>document.getElementById(id);

const sealText=text=>{const nonce=nacl.randomBytes(24),ct=nacl.secretbox(enc.encode(JSON.stringify({kind:'text',text})),nonce,S.key),out=new Uint8Array(24+ct.length);out.set(nonce);out.set(ct,24);return b64e(out)};

function cryptoId(){return b64e(nacl.randomBytes(9)).replace(/[^a-zA-Z0-9]/g,'')}

function inline(text){return text.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function md(src){const lines=esc(src).split('\n');let html='',code=null,list=false;for(let i=0;i<lines.length;i++){const line=lines[i];if(/^```/.test(line)){if(code!==null){html+='<pre><code>'+code.join('\n')+'</code></pre>';code=null}else{if(list){html+='</ul>';list=false}code=[]}continue}if(code!==null){code.push(line);continue}if(line.includes('|')&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){if(list){html+='</ul>';list=false}const rows=[];while(i<lines.length&&lines[i].includes('|')){rows.push(lines[i].replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>inline(c.trim())));i++}i--;html+='<table><thead><tr>'+rows[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(2).map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>';continue}if(/^\s*[-*] /.test(line)){if(!list){html+='<ul>';list=true}html+='<li>'+inline(line.replace(/^\s*[-*] /,''))+'</li>';continue}if(list){html+='</ul>';list=false}if(/^#{1,6} /.test(line))html+='<h3>'+inline(line.replace(/^#{1,6} /,''))+'</h3>';else html+=line?inline(line)+'<br>':'<br>'}if(code!==null)html+='<pre><code>'+code.join('\n')+'</code></pre>';if(list)html+='</ul>';return html.replace(/(?:<br>)+$/,'')}
function welcome(){return '<div class="welcome"><div class="welcome-mark"><svg aria-hidden="true"><use href="#network-mark"/></svg></div><p class="welcome-eyebrow">A LITTLE HELP. A BIG DIFFERENCE.</p><h1>把想法，交给<span>你的搭档。</span></h1><p class="welcome-description">一个问题、一点灵感，或一个待完成的任务。<br>从这里开始，一起把它做好。</p><div class="starters"><button class="starter" data-prompt="我有一个想法，帮我一起梳理思路。"><svg aria-hidden="true"><use href="#spark"/></svg><strong>一起梳理思路</strong><small>让想法更清晰</small></button><button class="starter" data-prompt="帮我拆解一个任务，制定可执行的步骤。"><svg aria-hidden="true"><use href="#arrow-up"/></svg><strong>拆解一个任务</strong><small>找到下一步</small></button><button class="starter" data-prompt="我想听听你的专业建议。"><svg aria-hidden="true"><use href="#network-mark"/></svg><strong>聊聊专业建议</strong><small>换个角度思考</small></button></div></div>'}
function render(){const log=$('log'),stick=log.scrollHeight-log.scrollTop-log.clientHeight<100;let html='';for(const m of [...S.msgs.values()].sort((a,b)=>a.seq-b.seq)){if(m.sys){html+='<div class="sys">'+esc(m.text)+'</div>';continue}const me=m.fromId===S.memberId,time=m.ts?new Date(m.ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';html+='<article class="row'+(me?' me':'')+'"><div class="message-meta"><span class="who">'+esc(me?'你':m.fromName||S.groupName)+'</span><time>'+esc(time)+'</time></div><div class="bubble'+(m.revoked?' tomb':'')+'">'+(m.revoked?'消息已撤回':md(m.text))+'</div>'+(me&&!m.revoked?'<div class="message-actions"><button data-revoke="'+m.seq+'" aria-label="撤回这条消息">撤回</button></div>':'')+'</article>'}for(const [id,m] of S.outbox){html+='<article class="row me"><div class="message-meta"><span class="who">你</span></div><div class="bubble">'+md(m.text)+'</div><div class="message-actions">'+(m.failed?'<button class="failed" data-retry="'+id+'">发送失败，点击重试</button>':'<span>正在发送…</span>')+'</div></article>'}if(S.waiting)html+='<div class="waiting" role="status"><i></i><i></i><i></i><span>正在等待搭档回复…</span></div>';log.innerHTML=html||welcome();if(stick)log.scrollTop=log.scrollHeight}
function absorb(m){if(!m||typeof m.seq!=='number')return;if(m.revokedAt){const old=S.msgs.get(m.seq);S.msgs.set(m.seq,{...old,seq:m.seq,revoked:true,fromId:m.from?.memberId});S.readUpTo=Math.max(S.readUpTo,m.seq);return}try{const p=openText(m.ct);if(!['text','system'].includes(p.kind)||typeof p.text!=='string')return;const me=m.from?.memberId===S.memberId;S.msgs.set(m.seq,{seq:m.seq,sys:p.kind==='system'||m.system===true,text:p.text,fromId:m.from?.memberId,fromName:m.from?.name,ts:m.ts});if(me){for(const [id,item] of S.outbox)if(item.opKey===m.opKey)S.outbox.delete(id)}else if(!m.from?.human)S.waiting=false;S.readUpTo=Math.max(S.readUpTo,m.seq)}catch{S.key=null;disconnect();notice('');setup('邀请信息无法解锁会话','请邀请方重新分享完整链接，再从链接进入。');status('无法解锁');$('msg').placeholder='请重新获取完整邀请链接'}}
function ack(){if(S.readUpTo>0)send({op:'group-ack',groupId:S.groupId,payload:{groupId:S.groupId,memberId:S.memberId,upToSeq:S.readUpTo}})}
async function sync(){if(S.syncing)return;const gen=S.generation;S.syncing=true;try{let after=S.readUpTo;for(let page=0;page<30;page++){const r=await rpc('group-sync',{groupId:S.groupId,memberId:S.memberId,afterSeq:after,limit:200});if(gen!==S.generation)return;if(!r.ok)throw Error(r.error?.message||'读取对话失败');const msgs=r.data.msgs||[];for(const m of msgs){absorb(m);if(gen!==S.generation)return}const last=msgs.reduce((n,m)=>Math.max(n,m.seq),after);if(msgs.length<200||last<=after)break;after=last}ack();render()}finally{if(gen===S.generation)S.syncing=false}}
async function post(id){const item=S.outbox.get(id);if(!item||item.sending||!S.ready)return;item.failed=false;item.sending=true;render();try{for(let attempt=0;attempt<3;attempt++){const r=await rpc('group-post',{ct:item.ct,opKey:item.opKey,readUpTo:S.readUpTo,memberId:S.memberId});if(r.ok){S.outbox.delete(id);S.waiting=true;if(!S.msgs.has(r.data.seq))S.msgs.set(r.data.seq,{seq:r.data.seq,text:item.text,fromId:S.memberId,fromName:'你',ts:Date.now()});S.readUpTo=Math.max(S.readUpTo,r.data.seq||0);ack();render();return}if(r.error?.code!=='new_messages')throw Error(r.error?.message||'发送失败');for(const m of r.data?.msgs||[])absorb(m);await sync()}throw Error('消息较多，请重试')}catch(error){item.failed=true;toast(error.message);render()}finally{item.sending=false}}
function submit(){const text=$('msg').value.trim();if(!text||!S.ready||S.ended)return;const id=cryptoId();S.outbox.set(id,{text,ct:sealText(text),opKey:'gu_'+id,failed:false,sending:false});$('msg').value='';composer();render();$('log').scrollTop=$('log').scrollHeight;void post(id)}
$('box').addEventListener('submit',e=>{e.preventDefault();submit()});$('msg').addEventListener('input',composer);$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}});
$('log').addEventListener('click',async e=>{const retry=e.target.closest('#retry');if(retry){start();return}const starter=e.target.closest('[data-prompt]');if(starter&&S.ready){$('msg').value=starter.dataset.prompt;composer();$('msg').focus();return}const resend=e.target.closest('[data-retry]');if(resend){void post(resend.dataset.retry);return}const revoke=e.target.closest('[data-revoke]');if(!revoke||!S.ready)return;const seq=Number(revoke.dataset.revoke),m=S.msgs.get(seq);if(m?.fromId!==S.memberId||!confirm('撤回这条消息？'))return;try{const r=await rpc('group-revoke',{seq,memberId:S.memberId});if(!r.ok)throw Error(r.error?.message||'撤回失败');S.msgs.set(seq,{...m,revoked:true});render()}catch(error){toast(error.message)}});
$('reconnect').addEventListener('click',()=>start());
function start(){if(!S.code||!S.key||S.ended)return;disconnect();const gen=S.generation;status('正在连接','loading');if(S.groupId)notice('正在恢复连接…');else setup('正在连接你的搭档','为这次协作准备一个安静的空间。');status('正在连接','loading');const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/guest');S.ws=ws;const timeout=setTimeout(()=>{if(gen===S.generation&&!S.ready){ws.close()}},12000);ws.onopen=()=>{ws.send(JSON.stringify({type:'guest-hello',code:S.code}))};ws.onmessage=async event=>{if(gen!==S.generation)return;let d;try{d=JSON.parse(event.data)}catch{return}if(d.type==='guest-joined'){clearTimeout(timeout);S.groupId=d.groupId;S.memberId=d.memberId;S.groupName=String(d.groupName||'你的数字员工').replace(/^雇佣[·・\s]*/,'');$('gname').textContent=S.groupName;document.title=S.groupName+' · Agent_NET';S.ready=true;S.reconnectAttempt=0;status('已连接','online');notice('');composer();try{await sync()}catch(error){if(gen===S.generation)notice(error.message,true)}return}if(d.type==='error'){disconnect();const reason=String(d.reason||'');S.ended=/不存在|关闭|到期|失效|锁定|次数/.test(reason);setup(S.ended?'这份邀请暂时无法使用':'暂时无法进入会话',S.ended?'请联系邀请方，获取一份新的邀请链接。':reason||'请稍后重试，或联系邀请方检查连接。',!S.ended);return}try{const env=JSON.parse(dec.decode(b64d(d.payload)));if(env.op==='group-result'){const r=env.payload||{},id=r.reqId||env.reqId,p=S.pending.get(id);if(p){clearTimeout(p.timer);S.pending.delete(id);p.resolve(r)}return}if(env.op==='group-msg'){absorb(env.payload);if(!S.key)return;render();ack()}if(env.op==='group-meta'&&env.payload?.event==='dissolved'){S.ended=true;disconnect();status('已结束');notice('这次协作已结束，感谢与你一起工作。');if(!S.msgs.size)setup('这次协作已结束','如需继续，请联系邀请方获取新的邀请。');composer()}}catch{}};ws.onerror=()=>{};ws.onclose=()=>{clearTimeout(timeout);if(gen!==S.generation||S.ended)return;S.ready=false;composer();for(const p of S.pending.values()){clearTimeout(p.timer);p.reject(Error('连接已断开'))}S.pending.clear();S.syncing=false;status('连接已断开');if(S.reconnectAttempt>=3){if(S.groupId)notice('暂时无法连接，已保留当前对话。',true);else setup('搭档暂时还未连接','请检查网络后重试，或联系邀请方。',true);return}const delay=[1500,3000,6000][S.reconnectAttempt++];if(S.groupId)notice('连接暂时中断，正在自动重连…',true);S.reconnectTimer=setTimeout(start,delay)}}
(function init(){const path=location.pathname.match(/^\/hire\/([A-Z2-7]{4,9}-[A-Z2-7]{4,9})\/?$/i),hash=location.hash.match(/^#k=([A-Za-z0-9+/=]+)$/);if(!path||!hash){setup('邀请信息不完整','请让邀请方重新分享完整链接，再从链接直接进入。');return}try{S.code=path[1].toUpperCase();S.key=b64d(hash[1]);if(S.key.length!==32)throw Error('key');start()}catch{setup('邀请信息不完整','请让邀请方重新分享完整链接，再从链接直接进入。')}})();
window.addEventListener('online',()=>{if(!S.ready&&!S.ended&&S.key){S.reconnectAttempt=0;start()}});
window.addEventListener('pagehide',()=>disconnect());
</script>
